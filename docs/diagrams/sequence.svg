<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 615" role="img" aria-label="Step-by-step sequence of one real Espresso Doctor run with two tool calls and two model requests" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2d3a"/></marker>
    <marker id="sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a74ad"/></marker>
    <marker id="sc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07a1e"/></marker>
  </defs>
  <rect width="980" height="615" rx="18" fill="#f3f9fd"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2d3a">One real run, step by step</text>
  <text x="24" y="54" font-size="12" fill="#4a5b6b">Shot 5: 18 g → 36 g, 31 s, grind 10, balanced · 4 earlier shots · gpt-5.6-luna via Portkey (cache MISS) · 5.88 s</text>

  <!-- lane heads -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="40" y="72" width="130" height="34" rx="9" fill="#fff" stroke="#c6e2f4" stroke-width="2"/><text x="105" y="94" fill="#1d5583">Browser UI</text>
    <rect x="230" y="72" width="130" height="34" rx="9" fill="#fff" stroke="#c6e2f4" stroke-width="2"/><text x="295" y="94" fill="#1d5583">FastAPI</text>
    <rect x="420" y="72" width="150" height="34" rx="9" fill="#fbf1d9" stroke="#e3b857" stroke-width="2"/><text x="495" y="94" fill="#5c3f0b">Agent</text>
    <rect x="630" y="72" width="130" height="34" rx="9" fill="#2a74ad"/><text x="695" y="94" fill="#fff">Tools</text>
    <rect x="820" y="72" width="130" height="34" rx="9" fill="#1f2d3a"/><text x="885" y="94" fill="#fff">Model</text>
  </g>
  <g stroke="#b9c8d4" stroke-width="1.5" stroke-dasharray="4 5">
    <path d="M105,106 V585"/><path d="M295,106 V585"/><path d="M495,106 V585"/><path d="M695,106 V585"/><path d="M885,106 V585"/>
  </g>

  <g font-size="11.5" fill="#1f2d3a">
    <!-- 1 -->
    <path d="M105,135 H291" stroke="#1f2d3a" stroke-width="1.6" marker-end="url(#sa)"/>
    <circle cx="120" cy="124" r="9" fill="#e3b857"/><text x="120" y="128" text-anchor="middle" font-size="10" font-weight="700">1</text>
    <text x="135" y="128">POST shot → validated, saved</text>
    <!-- 2 -->
    <path d="M295,172 H491" stroke="#1f2d3a" stroke-width="1.6" marker-end="url(#sa)"/>
    <circle cx="310" cy="161" r="9" fill="#e3b857"/><text x="310" y="165" text-anchor="middle" font-size="10" font-weight="700">2</text>
    <text x="325" y="165">run(prompt: SHOT DATA as JSON)</text>
    <!-- 3 -->
    <path d="M495,209 H881" stroke="#1f2d3a" stroke-width="1.6" marker-end="url(#sa)"/>
    <circle cx="510" cy="198" r="9" fill="#e3b857"/><text x="510" y="202" text-anchor="middle" font-size="10" font-weight="700">3</text>
    <text x="525" y="202">Request 1: instructions + shot data + tool schemas · 994 tokens in</text>
    <!-- 4 -->
    <path d="M885,248 H499" stroke="#b07a1e" stroke-width="1.6" marker-end="url(#sc)"/>
    <circle cx="870" cy="237" r="9" fill="#e3b857"/><text x="870" y="241" text-anchor="middle" font-size="10" font-weight="700">4</text>
    <text x="855" y="241" text-anchor="end">calls BOTH tools in parallel · 58 tokens out</text>
    <!-- 5 -->
    <path d="M495,286 H691" stroke="#2a74ad" stroke-width="1.8" marker-end="url(#sb)"/>
    <circle cx="510" cy="275" r="9" fill="#e3b857"/><text x="510" y="279" text-anchor="middle" font-size="10" font-weight="700">5</text>
    <text x="525" y="279">calculate_brew_ratio(18, 36)</text>
    <path d="M695,310 H499" stroke="#2a74ad" stroke-width="1.8" marker-end="url(#sb)"/>
    <text x="525" y="326" fill="#1d5583">→ 1:2.00, "normale (classic range)"</text>
    <!-- 6 -->
    <path d="M495,358 H691" stroke="#2a74ad" stroke-width="1.8" marker-end="url(#sb)"/>
    <circle cx="510" cy="347" r="9" fill="#e3b857"/><text x="510" y="351" text-anchor="middle" font-size="10" font-weight="700">6</text>
    <text x="525" y="351">get_shot_history(limit=10)</text>
    <path d="M695,382 H499" stroke="#2a74ad" stroke-width="1.8" marker-end="url(#sb)"/>
    <text x="525" y="398" fill="#1d5583">→ 4 shots from SQLite; shot 4's injection note withheld</text>
    <!-- 7 -->
    <path d="M495,432 H881" stroke="#1f2d3a" stroke-width="1.6" marker-end="url(#sa)"/>
    <circle cx="510" cy="421" r="9" fill="#e3b857"/><text x="510" y="425" text-anchor="middle" font-size="10" font-weight="700">7</text>
    <text x="525" y="425">Request 2: + tool results · 1,658 tokens in</text>
    <!-- 8 -->
    <path d="M885,470 H499" stroke="#b07a1e" stroke-width="1.6" marker-end="url(#sc)"/>
    <circle cx="870" cy="459" r="9" fill="#e3b857"/><text x="870" y="463" text-anchor="middle" font-size="10" font-weight="700">8</text>
    <text x="855" y="463" text-anchor="end">structured Diagnosis (schema-checked) · 502 tokens out</text>
    <!-- 9 -->
    <path d="M495,512 H299" stroke="#1f2d3a" stroke-width="1.6" marker-end="url(#sa)"/>
    <circle cx="480" cy="501" r="9" fill="#e3b857"/><text x="480" y="505" text-anchor="middle" font-size="10" font-weight="700">9</text>
    <text x="465" y="505" text-anchor="end">guardrails → result + usage</text>
    <!-- 10 -->
    <path d="M295,552 H109" stroke="#1f2d3a" stroke-width="1.6" marker-end="url(#sa)"/>
    <circle cx="280" cy="541" r="9" fill="#e3b857"/><text x="280" y="545" text-anchor="middle" font-size="10" font-weight="700">10</text>
    <text x="265" y="545" text-anchor="end">"No change: keep grind 10"</text>
    <text x="300" y="572" font-size="11" fill="#4a5b6b">logged: 2,652 in / 560 out tokens · 2 requests · 2 tool calls · ≈ $0.0012 at list price</text>
  </g>
  <text x="24" y="604" font-size="10.5" fill="#6d7d8c">Steps 3–8: recorded message trace (evidence/live_runs/*-trace_shot5_with_history.json). Steps 1–2 and 9–10: the app's normal HTTP path, as exercised in the UI runs.</text>
</svg>
