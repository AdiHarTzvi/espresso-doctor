<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Measured input tokens per diagnosis rise from 2,186 with no history to 2,652 with four previous shots" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="640" height="300" rx="14" fill="#ffffff"/>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1f2d3a">Input tokens per diagnosis vs. shots in history</text>
  <text x="20" y="46" font-size="11" fill="#6d7d8c">Measured, one demo session (shots 1–4 via the UI, shot 5 via the trace). Output tokens stayed 429–567.</text>
  <!-- axes: y from 0 to 3000 over 200px; baseline y=260; scale 200/3000 -->
  <g stroke="#dbe6ee" stroke-width="1">
    <path d="M70,260 H620"/><path d="M70,193.3 H620"/><path d="M70,126.7 H620"/><path d="M70,60 H620"/>
  </g>
  <g font-size="11" fill="#6d7d8c" text-anchor="end">
    <text x="62" y="264">0</text><text x="62" y="197">1,000</text><text x="62" y="131">2,000</text><text x="62" y="64">3,000</text>
  </g>
  <path d="M70,260 H620" stroke="#b9c8d4" stroke-width="1"/>
  <!-- bars: width 64, gap; heights = v*200/3000 -->
  <g fill="#2a74ad">
    <path d="M100,260 V117.3 a4,4 0 0 1 4,-4 h56 a4,4 0 0 1 4,4 V260 z"/>
    <path d="M206,260 V109.5 a4,4 0 0 1 4,-4 h56 a4,4 0 0 1 4,4 V260 z"/>
    <path d="M312,260 V99.3 a4,4 0 0 1 4,-4 h56 a4,4 0 0 1 4,4 V260 z"/>
    <path d="M418,260 V93.8 a4,4 0 0 1 4,-4 h56 a4,4 0 0 1 4,4 V260 z"/>
    <path d="M524,260 V86.1 a4,4 0 0 1 4,-4 h56 a4,4 0 0 1 4,4 V260 z"/>
  </g>
  <g font-size="12" font-weight="700" fill="#1f2d3a" text-anchor="middle">
    <text x="132" y="106">2,186</text><text x="238" y="98">2,302</text><text x="344" y="88">2,456</text><text x="450" y="82">2,538</text><text x="556" y="75">2,652</text>
  </g>
  <g font-size="11.5" fill="#4a5b6b" text-anchor="middle">
    <text x="132" y="278">0 shots</text><text x="238" y="278">1</text><text x="344" y="278">2</text><text x="450" y="278">3</text><text x="556" y="278">4</text>
  </g>
  <text x="345" y="295" font-size="11" fill="#6d7d8c" text-anchor="middle">previous shots returned by get_shot_history (capped at 10)</text>
</svg>
